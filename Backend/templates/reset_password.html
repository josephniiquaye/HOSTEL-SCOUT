{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Reset Password</h2>

        <p>Create a new password for your account.</p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="New Password"
                required>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <br>

        <a href="{{ url_for('auth.login') }}">
            ← Back to Login
        </a>

    </div>

</div>

{% endblock %}
