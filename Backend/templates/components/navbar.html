<div class="nav-actions">
    {% if session.get('user_id') %}
        <a href="{{ url_for('auth.profile') }}" class="btn btn-outline">Profile</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline">Logout</a>
        {% if session.get('role') == 'student' %}
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-primary">Dashboard</a>
        {% elif session.get('role') == 'owner' %}
            <a href="{{ url_for('owner_dashboard') }}" class="btn btn-primary">Dashboard</a>
        {% elif session.get('role') == 'admin' %}
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary">Dashboard</a>
        {% endif %}
    {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline">Login</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Register</a>
    {% endif %}
</div>
